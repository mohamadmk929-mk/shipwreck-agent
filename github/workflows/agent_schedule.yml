name: Shipwreck Hunters Video Agent

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install edge-tts moviepy requests pillow numpy

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipwreck-video-${{ github.run_number }}
          path: output/
          retention-days: 30
